version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # pyobjc 13.0 crashes on import on macOS 15 (see the comment in pyproject.toml).
      - dependency-name: "pyobjc*"
        versions: [">=13"]
