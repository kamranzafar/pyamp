name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            dbus playerctl libmpv2
      - name: Install libmpv
        if: runner.os == 'macOS'
        run: brew install mpv
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - name: "TEMP: diagnose QMediaPlayer crash on Linux"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          code='from PySide6.QtWidgets import QApplication; app = QApplication([]); from pyamp.audio.qt_backend import QtAudioBackend; QtAudioBackend().close(); print("qt backend ok")'
          echo "== Qt backend alone"; uv run python -X faulthandler -c "$code"; echo "exit $?"
          echo "== libmpv loaded first"; uv run python -X faulthandler -c "import pyamp.audio.mpv_backend; $code"; echo "exit $?"
          echo "== Qt first, then libmpv"; uv run python -X faulthandler -c "$code; import pyamp.audio.mpv_backend; print('mpv after qt ok')"; echo "exit $?"
      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # A private session bus, so the MPRIS tests talk to a real D-Bus daemon.
            dbus-run-session -- uv run pytest -q -rs --cov
          else
            uv run pytest -q -rs --cov
          fi
      - name: Load libmpv from a folder (PYAMP_LIBMPV)
        shell: bash
        run: |
          # Copy the runner's libmpv into a folder of its own, as a bundled app would have it.
          mkdir -p "$RUNNER_TEMP/libmpv"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp -L /usr/lib/x86_64-linux-gnu/libmpv.so.2 "$RUNNER_TEMP/libmpv/"
          else
            cp -L "$(brew --prefix)/lib/libmpv.dylib" "$RUNNER_TEMP/libmpv/libmpv.2.dylib"
          fi
          PYAMP_LIBMPV="$RUNNER_TEMP/libmpv" uv run pytest -q -rs \
            tests/test_libmpv_loader.py tests/test_mpv_backend.py
