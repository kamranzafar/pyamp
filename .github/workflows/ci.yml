name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        timeout-minutes: 8
        # A stalled apt mirror can hang forever; give each try 2 minutes, then retry.
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update &&
               sudo timeout 120 apt-get $apt_opts install -y --no-install-recommends \
                 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
                 dbus playerctl libmpv2 pipewire-bin pulseaudio; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1
      - name: Install libmpv
        if: runner.os == 'macOS'
        run: brew install mpv
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - name: Start a silent audio server (Linux)
        # Gives QtMultimedia an output device ("Dummy Output"), so the Qt backend's
        # playback tests run instead of skipping.
        if: runner.os == 'Linux'
        # PulseAudio suspends an idle output after a few seconds. Paused in a test, Qt's
        # FFmpeg backend then didn't restart audio on resume and QMediaPlayer.stop() hung
        # (CI log: "Sink #0 State: SUSPENDED", then "Free audio output" and no new one).
        # Keep the dummy output awake.
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl unload-module module-suspend-on-idle || echo "suspend-on-idle wasn't loaded"
          pactl info | grep -E "Server Name|Default Sink"
          pactl list short modules | grep -c suspend-on-idle || true  # 0: unloaded
      - name: Qt backend tests, with Qt Multimedia's debug log
        # QMediaPlayer.stop() has hung a few times on CI (virtual audio devices). These tests
        # run only here, uncaptured, so Qt's log survives a hang and shows which step blocks.
        # Diagnostic; fold back into the full run once understood.
        shell: bash
        env:
          QT_LOGGING_RULES: "qt.multimedia*=true"
        run: |
          run() { if [ "$RUNNER_OS" = "Linux" ]; then dbus-run-session -- "$@"; else "$@"; fi; }
          status=0
          run uv run pytest tests/test_qt_backend.py -q -rs -s -p no:cacheprovider --cov || status=$?
          # 5 = nothing ran: every test skipped because the runner has no audio device.
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then exit "$status"; fi
      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # A private session bus, so the MPRIS tests talk to a real D-Bus daemon.
            dbus-run-session -- uv run pytest -q -rs --cov --cov-append --ignore=tests/test_qt_backend.py
          else
            uv run pytest -q -rs --cov --cov-append --ignore=tests/test_qt_backend.py
          fi
      - name: Survive an incomplete PipeWire install
        # libpipewire without its client.conf crashes Qt's PipeWire audio backend;
        # PyAmp must detect it and fall back to PulseAudio (see qt_audio_env.py).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove -y -qq pipewire-bin >/dev/null
          test ! -e /usr/share/pipewire/client.conf
          uv run pyamp --self-test 2>&1 | tee selftest.txt
          grep -q "client.conf" selftest.txt
      - name: Load libmpv from a folder (PYAMP_LIBMPV)
        # Windows has no system libmpv to copy; its bundled one is tested by the package workflow.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Copy the runner's libmpv into a folder of its own, as a bundled app would have it.
          mkdir -p "$RUNNER_TEMP/libmpv"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp -L /usr/lib/x86_64-linux-gnu/libmpv.so.2 "$RUNNER_TEMP/libmpv/"
          else
            cp -L "$(brew --prefix)/lib/libmpv.dylib" "$RUNNER_TEMP/libmpv/libmpv.2.dylib"
          fi
          PYAMP_LIBMPV="$RUNNER_TEMP/libmpv" uv run pytest -q -rs \
            tests/test_libmpv_loader.py tests/test_mpv_backend.py
