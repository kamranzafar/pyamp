# TEMPORARY: diagnose QAudioOutput() segfault on Linux. Remove before merging.
name: Diagnose Linux Qt audio

on:
  push:
    branches: [fix/linux-qt-backend]

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Base packages (as CI, minus libmpv2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            dbus playerctl gdb >/dev/null
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - name: Probe
        shell: bash
        run: |
          set +e
          cat > plain.py <<'PY'
          import faulthandler; faulthandler.enable()
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          from PySide6.QtMultimedia import QAudioOutput, QMediaPlayer
          QMediaPlayer(); QAudioOutput(); print("plain Qt ok", flush=True)
          PY
          cat > pyamp_qt.py <<'PY'
          import faulthandler; faulthandler.enable()
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          from pyamp.audio.qt_backend import QtAudioBackend
          QtAudioBackend().close(); print("pyamp QtAudioBackend ok", flush=True)
          PY
          cat > pyamp_steps.py <<'PY'
          import faulthandler; faulthandler.enable()
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          from PySide6.QtMultimedia import QAudioBufferOutput, QAudioOutput, QMediaPlayer
          p = QMediaPlayer(); print("player", flush=True)
          o = QAudioOutput(); print("output", flush=True)
          t = QAudioBufferOutput(); print("buffer output", flush=True)
          p.setAudioOutput(o); print("setAudioOutput", flush=True)
          p.setAudioBufferOutput(t); print("setAudioBufferOutput", flush=True)
          PY
          run() { echo; echo "===== $1"; timeout 60 uv run python "$2" 2>&1 | grep -v "^qt.multimedia.ffmpeg: Using" | tail -12; echo "exit ${PIPESTATUS[0]}"; }
          sudo apt-get install -y -qq --no-install-recommends libmpv2 >/dev/null
          echo "===== which package owns pipewire's client.conf?"
          dpkg -S client.conf 2>/dev/null | grep -i pipewire || echo "not installed by any package"
          apt-file --version >/dev/null 2>&1 || sudo apt-get install -y -qq apt-file >/dev/null; sudo apt-file update >/dev/null 2>&1
          apt-file search /usr/share/pipewire/client.conf | head -3
          echo "===== libpipewire recommends:"; apt-cache depends "$(dpkg -l | awk '/libpipewire-0.3-0/ {print $2; exit}')" | grep -iE "Recommends|Depends" | head
          run "with libmpv2, QT_AUDIO_BACKEND=pulseaudio" plain.py QT_AUDIO_BACKEND=pulseaudio
          echo "===== (env)"; QT_AUDIO_BACKEND=pulseaudio timeout 60 uv run python pyamp_qt.py 2>&1 | grep -vE "^qt.multimedia" | tail -4; echo "exit ${PIPESTATUS[0]}"
          pkg=$(apt-file search /usr/share/pipewire/client.conf | head -1 | cut -d: -f1)
          echo "===== installing $pkg"; sudo apt-get install -y -qq --no-install-recommends "$pkg" >/dev/null
          run "with libmpv2 + $pkg" pyamp_qt.py
