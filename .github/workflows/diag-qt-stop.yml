name: Diagnose Qt stop() hang

on:
  pull_request:
    paths: [".github/workflows/diag-qt-stop.yml"]

jobs:
  stress:
    name: stop() stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: "qt.multimedia*=true"
    steps:
      - uses: actions/checkout@v7
      - name: Qt runtime and a silent audio server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 dbus pulseaudio >/dev/null
          pulseaudio --start --exit-idle-time=-1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - name: Run the stop() test 40 times
        shell: bash
        run: |
          hangs=0
          for i in $(seq 1 40); do
            if ! uv run pytest -q -s -p no:cacheprovider \
                "tests/test_qt_backend.py::test_pause_resume_and_seek" > run.log 2>&1; then
              hangs=$((hangs + 1))
              echo "::group::run $i FAILED: last 400 lines"
              tail -n 400 run.log
              echo "::endgroup::"
            fi
          done
          echo "hangs: $hangs of 40"
          echo "::group::a passing run's log, for comparison"
          uv run pytest -q -s -p no:cacheprovider "tests/test_qt_backend.py::test_pause_resume_and_seek" 2>&1 | tail -n 200
          echo "::endgroup::"
