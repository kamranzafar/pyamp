name: Diagnose Qt stop() hang

on:
  pull_request:
    paths: [".github/workflows/diag-qt-stop.yml"]

jobs:
  stress:
    name: stop() stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: "qt.multimedia*=true"
    steps:
      - uses: actions/checkout@v7
      - name: Qt runtime and a silent audio server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 dbus pulseaudio >/dev/null
          pulseaudio --start --exit-idle-time=-1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - name: Qt backend file with coverage (x30), then the full suite with coverage (x10)
        shell: bash
        run: |
          stress() {  # stress <times> <label> <pytest args...>
            local times=$1 label=$2; shift 2; local hangs=0
            for i in $(seq 1 "$times"); do
              if ! uv run pytest -q -s -p no:cacheprovider -o faulthandler_timeout=60 \
                  -o faulthandler_exit_on_timeout=true "$@" > run.log 2>&1; then
                hangs=$((hangs + 1))
                echo "::group::$label run $i FAILED: last 400 lines"
                tail -n 400 run.log
                echo "::endgroup::"
              fi
            done
            echo "hangs ($label): $hangs of $times"
          }
          run() { if [ "$RUNNER_OS" = "Linux" ]; then dbus-run-session -- "$@"; else "$@"; fi; }
          stress 30 "qt file + cov" tests/test_qt_backend.py --cov
          export -f stress
          run bash -c 'stress 10 "full suite + cov" --cov'
