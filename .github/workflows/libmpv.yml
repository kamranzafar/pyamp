name: libmpv (audio only)

# Builds PyAmp's own audio-only libmpv (packaging/libmpv/build.sh) for Windows and macOS,
# then packages PyAmp with each and self-tests the app. Publishing them as a release for
# packaging/{windows,macos}/libmpv.lock is a separate, manual step.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/libmpv/**"
      - ".github/workflows/libmpv.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build libmpv-2.dll (mingw-w64 on Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the cross toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev nasm ninja-build pkg-config cmake
          pipx install meson

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: ~/libmpv-cache
          key: libmpv-sources-${{ hashFiles('packaging/libmpv/sources.lock') }}

      - name: Build
        run: |
          export PYAMP_LIBMPV_CACHE=$HOME/libmpv-cache
          packaging/libmpv/build.sh windows-x86_64 libmpv-out
          echo "libmpv-2.dll: $(du -h libmpv-out/libmpv-2.dll | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-windows-x86_64
          path: libmpv-out/
          if-no-files-found: error

  app:
    name: PyAmp with it, self-tested (Windows)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked --group packaging

      - uses: actions/download-artifact@v7
        with:
          name: libmpv-windows-x86_64
          path: libmpv-out

      - name: Make sure Inno Setup is installed
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app, zip and installer with this libmpv
        run: packaging/windows/build.ps1 -Out dist -Libmpv libmpv-out\libmpv-2.dll

      - name: Self-test the built app
        env:
          PYAMP_SELFTEST_TRACEBACK: "1"
        run: |
          $exe = "dist\PyAmp\pyamp-console.exe"
          $version = & $exe --version
          $version
          if (-not ($version -match "\(bundled\)")) { throw "the app did not use its bundled libmpv" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }

      - name: Sizes
        run: |
          $rows = Get-ChildItem dist -File | ForEach-Object { "| $($_.Name) | $([math]::Round($_.Length / 1MB, 1)) MB |" }
          $app = [math]::Round((Get-ChildItem dist\PyAmp -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          "| File | Size |`n|---|---|`n$($rows -join "`n")`n| PyAmp folder | $app MB |" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: PyAmp-windows-audio-libmpv
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: Build libmpv.dylib and self-test PyAmp with it (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install the build tools
        run: |
          brew install meson ninja nasm pkg-config
          command -v cmake

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: ~/libmpv-cache
          key: libmpv-sources-${{ hashFiles('packaging/libmpv/sources.lock') }}

      - name: Build
        run: |
          export PYAMP_LIBMPV_CACHE=$HOME/libmpv-cache
          packaging/libmpv/build.sh macos-${{ matrix.arch }} libmpv-out
          echo "libmpv.dylib (${{ matrix.arch }}): $(du -h libmpv-out/libmpv.dylib | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-macos-${{ matrix.arch }}
          path: libmpv-out/
          if-no-files-found: error

      - run: uv sync --locked --group packaging

      - name: Build PyAmp.app and .dmg with this libmpv
        run: packaging/macos/build.sh --libmpv libmpv-out dist

      - name: Self-test the built app
        env:
          PYAMP_SELFTEST_TRACEBACK: "1"
        run: |
          app=dist/PyAmp.app/Contents/MacOS/PyAmp
          "$app" --version | tee version.txt
          grep -q "(bundled)" version.txt || { echo "::error::app did not use its bundled libmpv"; exit 1; }
          "$app" --self-test
          codesign --verify --deep --strict dist/PyAmp.app
          echo "PyAmp.app: $(du -sh dist/PyAmp.app | cut -f1), DMG: $(du -h dist/*.dmg | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: PyAmp-macos-${{ matrix.arch }}-audio-libmpv
          path: dist/*.dmg
          if-no-files-found: error
