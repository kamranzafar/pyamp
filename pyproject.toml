[project]
name = "pyamp"
version = "1.0.1"
description = "A lightweight, Winamp-inspired music player written in Python."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "ADDITIONAL-TERMS.md"]
authors = [
    { name = "Kamran Zafar", email = "kamran@kamranzafar.org" }
]
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47",
    "numpy>=1.26",
    "platformdirs>=4.0",
    # macOS Now Playing / media keys. pyobjc 13.0's CoreMedia binding links
    # libswiftCoreMedia.dylib, which macOS 15 doesn't ship, so stay on 12.x for now.
    "pyobjc-framework-mediaplayer>=11,<13 ; sys_platform == 'darwin'",
    "pyobjc-core>=11,<13 ; sys_platform == 'darwin'",
    "pyside6-addons>=6.8",      # QtMultimedia (QAudioBufferOutput needs Qt >= 6.8)
    "pyside6-essentials>=6.8",  # QtCore / QtGui / QtWidgets
    "jeepney>=0.8 ; sys_platform == 'linux'",
    # Windows media controls (SMTC): media keys, volume flyout, lock screen.
    "winrt-runtime>=4.2 ; sys_platform == 'win32'",
    "winrt-Windows.Media>=4!10.0.28000 ; sys_platform == 'win32'",
    "winrt-Windows.Media.Interop>=4.0 ; sys_platform == 'win32'",
    "mpv>=1.0.7",
    "keyring>=25",  # Subsonic plugin: the server password, in the system keychain
]

[project.scripts]
pyamp = "pyamp.app:main"

# Plugins are discovered through this entry-point group. Third-party packages
# can register their own plugins the same way.
[project.entry-points."pyamp.plugins"]
now-playing-log = "pyamp.plugins.now_playing:NowPlayingLogPlugin"
media-session = "pyamp.plugins.media_session:MediaSessionPlugin"
subsonic = "pyamp.plugins.subsonic:SubsonicPlugin"
dlna = "pyamp.plugins.dlna:DlnaPlugin"
radio-browser = "pyamp.plugins.radio_browser:RadioBrowserPlugin"
chords = "pyamp.plugins.chords:ChordsPlugin"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jeepney>=0.9.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
packaging = [
    "pyinstaller>=6.22",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Tests take their collaborators as pytest fixtures, i.e. as positional arguments.
"tests/*" = ["PLR0917"]

[tool.ruff.lint.pep8-naming]
# Qt event handlers (mousePressEvent, paintEvent, ...) are camelCase by necessity.
ignore-names = [
    "*Event", "sizeHint", "minimumSizeHint", "rowCount", "columnCount", "headerData",
    "eventFilter", "mimeTypes", "mimeData", "dropMimeData", "supportedDropActions", "canDropMimeData",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict_equality = false  # asserting state before/after an action trips mypy's narrowing
disallow_untyped_calls = false  # tests build mutagen tag objects, which are untyped

[[tool.mypy.overrides]]
module = ["mutagen", "mutagen.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyobjc, jeepney and python-mpv ship no type information; winrt is only installed on
# Windows (and type-checked there by its own stubs).
module = ["MediaPlayer", "jeepney", "jeepney.*", "mpv", "winrt", "winrt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that hangs prints every thread's stack after this many seconds, then the
# run stops (rather than holding a CI runner until the job times out).
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["pyamp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
